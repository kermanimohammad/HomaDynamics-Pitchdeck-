  <script>
    (function () {
      function computeBasename() {
        var el = document.querySelector('script[type="module"][src*="assets/index"]');
        if (!el || !el.getAttribute("src")) return "";
        try {
          var path = new URL(el.getAttribute("src"), location.href).pathname;
          var dir = path.replace(/\/[^/]+\.js$/i, "");
          if (dir.endsWith("/assets")) return dir.slice(0, -"/assets".length);
        } catch (e) {}
        return "";
      }
      window.__HOMADYNAMICS_BASENAME__ = computeBasename();
      if (location.pathname.endsWith("index.html")) {
        var b = window.__HOMADYNAMICS_BASENAME__;
        var home = b === "" ? "/" : b + "/";
        history.replaceState(null, "", home + location.search + location.hash);
      }
    })();
  </script>
